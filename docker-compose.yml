# Simple ERP - local stack: Postgres, Redis, RabbitMQ, the API, the notification
# worker and a mail catcher.
#
#   cp .env.example .env      # then edit secrets
#   docker compose up --build
#
# App        http://localhost:5173   (React frontend; proxies /api to the API)
# API        http://localhost:8000   (docs: /docs, health: /healthz, /readyz)
# RabbitMQ   http://localhost:15672  (management UI)
# Mailpit    http://localhost:8025   (every email the app sends lands here)
#
# Startup order: postgres/redis/rabbitmq healthy -> `migrate` (alembic + bootstrap,
# runs once and exits) -> api + worker -> frontend.

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-simple_erp}:${POSTGRES_PASSWORD:-simple_erp}@postgres:5432/${POSTGRES_DB:-simple_erp}
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-simple_erp}:${RABBITMQ_PASSWORD:-simple_erp}@rabbitmq:5672/
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-please}
  ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-dev-only-change-me-encryption-secret-32b}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  # The frontend's nginx is one trusted hop in front of the API. (Port 8000 is
  # also published for development; reaching it directly bypasses that hop.)
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@axon-erp.local}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  # Redis-backed rate limiting + dashboard cache; notifications delivered by the worker.
  RATE_LIMIT_ENABLED: "true"
  DASHBOARD_CACHE_SECONDS: ${DASHBOARD_CACHE_SECONDS:-30}
  ASYNC_NOTIFICATIONS: "true"
  ASYNC_PDF: "true"
  # Outbound mail goes to Mailpit; point these at a real SMTP relay in production.
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  SMTP_FROM: ${SMTP_FROM:-Simple ERP <no-reply@simple-erp.local>}
  PDF_ENGINE: ${PDF_ENGINE:-weasyprint}
  # Uploaded and generated files. The api AND the worker write here, so it is one shared volume; point the
  # S3_* settings at object storage in production instead (see DEPLOYMENT.md).
  DOCUMENT_LOCAL_DIR: /data/documents

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simple_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simple_erp}
      POSTGRES_DB: ${POSTGRES_DB:-simple_erp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache + rate-limit counters only: nothing here is worth persisting.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-simple_erp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-simple_erp}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  migrate:
    build: ./backend
    command: ["migrate"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    command: ["api"]
    restart: unless-stopped
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - documents:/data/documents
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build: ./backend
    command: ["worker"]
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - documents:/data/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

  # Daily verified dump of Postgres (+ the document files), 14 generations kept. Restore with
  # deploy/backup/restore.sh; details in DEPLOYMENT.md ("Backups").
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    command: ["loop"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-simple_erp}
      PGPASSWORD: ${POSTGRES_PASSWORD:-simple_erp}
      PGDATABASE: ${POSTGRES_DB:-simple_erp}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_POST_HOOK: ${BACKUP_POST_HOOK:-}
    volumes:
      - ./deploy/backup:/backup:ro
      - backups:/backups
      - documents:/data/documents:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "/backup/backup.sh", "status"]
      interval: 5m
      timeout: 10s
      start_period: 2m
      retries: 1

volumes:
  postgres-data:
  rabbitmq-data:
  documents:
  backups:
