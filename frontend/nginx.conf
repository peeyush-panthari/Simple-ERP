server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Bulk uploads / document uploads arrive as base64 JSON bodies.
  client_max_body_size 20m;

  # High-performance gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    text/javascript
    image/svg+xml;

  location /api/ {
    # Resolved per request so the frontend container can start before the API.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # One trusted hop: the API (TRUSTED_PROXY_HOPS=1) takes the client address
    # nginx appended, never anything the caller typed in front of it.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed build assets never change - cache them hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes: anything that isn't a file is the SPA shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
