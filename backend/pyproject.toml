[project]
name = "simple-erp-api"
version = "0.1.0"
description = "Simple ERP - FastAPI port of the Flask modular monolith (see the migration plan)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "pydantic>=2.8",
    "pydantic[email]",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "cryptography>=43.0",
    "weasyprint>=62.0",
    "boto3>=1.35",
    "qrcode[pil]>=8.0",
    "zxing-cpp>=3.1",
    "slowapi>=0.1.9",
    "redis>=5.0",
    "pika>=1.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-dotenv>=0.5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
